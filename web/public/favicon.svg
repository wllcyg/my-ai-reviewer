<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- 底座深色微光渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- 晶体顶面渐变 -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- 晶体左侧面渐变 -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- 晶体右侧面渐变 -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- 核心微光辐射 -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- 边框流光 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- 1. 圆角应用底座 (Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- 2. 立体晶体能量盒 (Isometric Cube) -->
  <g transform="translate(0, 1)">
    <!-- 晶体顶面 -->
    <polygon points="32,14 48,23 32,32 16,23" fill="url(#topFace)" opacity="0.95" />
    
    <!-- 晶体左面 -->
    <polygon points="16,23 32,32 32,50 16,41" fill="url(#leftFace)" opacity="0.9" />
    
    <!-- 晶体右面 -->
    <polygon points="32,32 48,23 48,41 32,50" fill="url(#rightFace)" opacity="0.98" />
  </g>

  <!-- 3. 中心能量球光晕 -->
  <circle cx="32" cy="33" r="11" fill="url(#coreGlow)" />

  <!-- 4. 晶体内部 AI 能量连线节点与微光 -->
  <circle cx="32" cy="33" r="2.5" fill="#ffffff" />
  <circle cx="25" cy="27" r="1.5" fill="#e0f2fe" opacity="0.8" />
  <circle cx="39" cy="27" r="1.5" fill="#e0f2fe" opacity="0.8" />
  <circle cx="32" cy="42" r="1.5" fill="#e0f2fe" opacity="0.8" />
  
  <line x1="32" y1="33" x2="25" y2="27" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
  <line x1="32" y1="33" x2="39" y2="27" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
  <line x1="32" y1="33" x2="32" y2="42" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />

  <!-- 5. 顶角灵动星芒 -->
  <path d="M46 12 L47 15 L50 16 L47 17 L46 20 L45 17 L42 16 L45 15 Z" fill="#38bdf8" />
  <circle cx="46" cy="16" r="1" fill="#ffffff" />
</svg>